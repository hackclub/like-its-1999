<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>* * * Windows 98 ~ Like It's 1999 ! ! ! * * *</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ccc;
        font: 13px monospace;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #toolbar {
        flex: 0 0 auto;
        padding: 4px 8px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      /* the parent adds .fs to <body> when it fullscreens the iframe */
      body.fs #toolbar {
        display: none;
      }
      /* buttons do not inherit the page font and a select does, so left alone the two
         disagree on both font and height. state both explicitly so the world switch is
         the same size as the buttons it sits next to */
      #toolbar button,
      #toolbar select {
        font:
          13px Arial,
          Helvetica,
          sans-serif;
        height: 22px;
        padding: 0 6px;
        box-sizing: border-box;
      }
      #shared-badge {
        color: #000;
        background: #ffcc00;
        padding: 2px 6px;
      }
      #screen_holder {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      /* the holder fullscreens, not #screen_container, so the container keeps
         shrink-wrapping the canvas: v86 maps the absolute mouse against the
         container's rect, so container == canvas keeps the cursor accurate */
      #screen_holder:fullscreen {
        background: #000;
      }
      /* v86 only sets pixelated itself at scale >= 1, and main.js scales by
         fractional amounts to hit exact integer device multiples */
      #screen_container canvas {
        image-rendering: pixelated;
      }
      #screen_container div {
        white-space: pre;
        font: 14px monospace;
        line-height: 14px;
        /* v86 scales the text div by writing both an explicit width/height and a css
           transform, so the layout box grows as the square of the scale while the glyphs
           grow linearly. anchoring top-left keeps the glyphs inside the box; main.js
           then trims the box back to the glyph extent so the holder centres it */
        transform-origin: top left;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <span id="world-slot" hidden></span>
      <button id="fullscreen" type="button">Fullscreen</button>
      <button id="save" type="button">Save</button>
      <button id="screenshot" type="button">Screenshot</button>
      <button id="export" type="button">Download machine</button>
      <button id="import-btn" type="button">Load machine...</button>
      <input id="import" type="file" accept=".gz,.bin" hidden />
      <button id="browse" type="button">Browse files...</button>
      <button id="cdrom-slot" type="button" disabled>Add files...</button>
      <button id="reboot" type="button">Force reboot</button>
      <button id="reset" type="button">Reset</button>
      <span id="shared-badge" hidden>shared</span>
      <span id="status">initializing...</span>
    </div>
    <div id="screen_holder">
      <div id="screen_container">
        <div></div>
        <canvas style="display: none"></canvas>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
